apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-trip-assistant
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: road-trip-assistant
  template:
    metadata:
      labels:
        app: road-trip-assistant
    spec:
      containers:
      - name: road-trip-assistant
        image: road-trip-assistant:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "1000m"      # Grants 1 full CPU core to handle multi-threaded startup smoothly
            memory: "512Mi"    # Raises memory ceiling to prevent Out-Of-Memory (OOM) kills
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30 # Gives Flask plenty of time to build thread pools before checks begin
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 25 # Increased warmup window so it won't crash during asset parsing
          periodSeconds: 10
          timeoutSeconds: 5
