<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Map - AI Road Trip Assistant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #070913;
            --bg-secondary: #0c0f24;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-glow: #6366f1;
            --secondary-glow: #a855f7;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Inter', sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            background: rgba(7, 9, 19, 0.6);
            z-index: 10;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--secondary-glow) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .header-icon svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            transition: var(--transition-smooth);
        }

        .btn-back:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.15);
        }

        .btn-back svg {
            width: 16px;
            height: 16px;
            transition: var(--transition-smooth);
        }

        .btn-back:hover svg {
            transform: translateX(-4px);
        }

        .map-frame-container {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            background: #0d0e14;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: var(--transition-smooth);
        }

        iframe:hover {
            border-color: rgba(99, 102, 241, 0.25);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }
            h1 {
                font-size: 1.1rem;
            }
            .map-frame-container {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title-group">
            <div class="header-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <h1>Your Scenic Route Map</h1>
        </div>
        <a href="/" class="btn-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Return to Dashboard
        </a>
    </header>

    <div class="map-frame-container">
        <iframe src="{{ url_for('static', filename='map.html') }}" title="Scenic Route Folium Map"></iframe>
    </div>
</body>
</html>
