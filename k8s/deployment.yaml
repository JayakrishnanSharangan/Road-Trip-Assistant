apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-trip-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate # Instantly drops old pod memory allocations before spinning up new build context
  selector:
    matchLabels:
      app: road-trip-assistant
  template:
    metadata:
      labels:
        app: road-trip-assistant
    spec:
      containers:
      - name: road-trip-assistant
        image: road-trip-assistant:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "800m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
