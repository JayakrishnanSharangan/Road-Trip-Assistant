<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Road Trip Assistant</title>
</head>
<body>
    <h1>AI Road Trip Assistant</h1>
    <form action="/route" method="get">
        <label for="start">Start Location:</label>
        <input type="text" id="start" name="start" placeholder="Enter a city or place" required><br>

        <label for="end">Destination:</label>
        <input type="text" id="end" name="end" placeholder="Enter a city or place" required><br>

        <button type="submit">Get Route</button>
    </form>
</body>
</html>
